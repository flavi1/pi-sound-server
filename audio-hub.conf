# =============================================================================
#  audio-hub.conf — fichier de configuration UNIQUE du serveur de son
#  Emplacement actif :  /etc/pi-sound-server/audio-hub.conf
#
#  Après toute modification :      sudo audio-hub apply
#  Voir les périphériques détectés : audio-hub list
#  Voir le routage en cours :       audio-hub status
#
#  Principe :
#    [toutes les entrées] ──► MASTER (volume global, knob) ──► [toutes les sorties]
#  Chaque section [output.xxx] / [input.xxx] décrit un CANDIDAT. Les candidats
#  peuvent être présents ou non : dès qu'un périphérique correspondant apparaît,
#  il est raccordé automatiquement ; s'il disparaît, il est détaché proprement.
#
#  Règles de correspondance (« match.<propriété> = valeur ») :
#    - toutes les lignes match.* d'une section doivent correspondre (ET logique) ;
#    - une valeur commençant par ~ est une expression régulière ;
#    - propriétés utiles : node.name, alsa.card_name, alsa.long_card_name,
#      device.vendor.id, device.product.id, device.serial, api.alsa.path
#      (« audio-hub list » les affiche toutes pour vos appareils).
#  Les lignes « # » sont des commentaires (en début de ligne uniquement).
# =============================================================================

[global]
# Utilisateur système qui exécute PipeWire, WirePlumber, Mopidy et le knob
user = hifi

# Nom technique et description du périphérique virtuel maître
master.name = MASTER
master.description = MASTER (toutes les sorties)

# Horloge du graphe PipeWire : 192 kHz = résolution native de la platine.
# Les sources à 96 kHz (S/PDIF) ou 44,1 kHz (Mopidy) sont suréchantillonnées.
clock.rate = 192000
# Fréquences autorisées : une seule => le graphe reste TOUJOURS à 192 kHz
clock.allowed-rates = 192000
# Taille de bloc (1024 trames à 192 kHz ≈ 5,3 ms). Augmenter si craquements.
clock.quantum = 1024
clock.min-quantum = 512
clock.max-quantum = 4096

# Qualité du rééchantillonneur (0..14, défaut PipeWire = 4).
# 10 est très bon et reste raisonnable sur Pi 4 / Pi 5 ; baisser si CPU saturé.
resample.quality = 10

# Volume MASTER au tout premier démarrage (0.0..1.0, échelle cubique).
# Prudence : ampli 2x30 W. Ensuite, le dernier volume réglé est restauré.
master.initial-volume = 0.25
master.max-volume = 1.0

# Compense les latences différentes entre sorties (HAT vs DAC USB) pour
# qu'elles jouent parfaitement en phase. Ajoute un peu de latence.
latency-compensate = false

# yes = les périphériques audio NON listés ci-dessous sont désactivés
# (ex. sortie inutile de l'adaptateur S/PDIF). no = ils restent visibles
# mais ne sont jamais raccordés au MASTER.
disable-unlisted = no


# =============================================================================
#  DÉMARRAGE : /boot/firmware/config.txt (appliqué par « audio-hub apply »,
#  redémarrage nécessaire si quelque chose change). Modifications réversibles.
# =============================================================================
[boot]
# no = ne jamais toucher à config.txt
manage = yes
# auto = /boot/firmware/config.txt (ou /boot/config.txt sur les anciens systèmes)
file = auto
# Overlay du HAT (« none » : aucun). DigiAMP+ : démuté au chargement du pilote.
# Si la carte n'apparaît pas dans « aplay -l » : rpi-digiampplus,unmute_amp
overlay = iqaudio-dacplus,unmute_amp
# Jack 3,5 mm de la Raspberry Pi
disable-onboard-audio = yes
# Audio HDMI (l'affichage console HDMI reste actif)
disable-hdmi-audio = yes


# =============================================================================
#  KNOB USB (bouton de volume)
# =============================================================================
[knob]
enabled = yes
# « auto » = TOUS les périphériques USB qui ont des touches Volume+/Volume-
#            (ou une molette), écoutés en même temps, branchables à chaud.
# Sinon : un ou plusieurs chemins séparés par des virgules, de préférence
#         stables : /dev/input/by-id/usb-…-event-…
# Lister les candidats :  sudo audio-hub knob-list
device = auto
# Pas de volume par cran (0.02 = 2 %)
step = 0.02
# Appui sur le bouton : mute | playpause (Mopidy) | none
press = mute
# Capture exclusive du knob (évite que la console reçoive aussi les touches)
grab = yes


# =============================================================================
#  SORTIES CANDIDATES
#  driver-priority : la sortie de plus haute priorité présente fournit l'horloge
#  maîtresse ; les autres s'y synchronisent par rééchantillonnage adaptatif.
#  Le HAT, toujours branché, doit avoir la priorité la plus haute.
#  Options : description, rate, format (S16LE, S24LE, S24_3LE, S32LE…),
#            driver-priority, period-size, headroom, enabled (yes/no)
# =============================================================================
[output.amp]
description = Ampli IQaudio DigiAMP+ (HAT)
match.alsa.card_name = ~.*(IQaudIO|IQaudio|DigiAMP).*
rate = 192000
format = S32LE
driver-priority = 2000

[output.dac]
description = DAC Topping DX3 Pro+ (USB)
match.node.name = ~alsa_output\.usb-.*(Topping|DX3).*
rate = 192000
driver-priority = 1500


# =============================================================================
#  ENTRÉES CANDIDATES
#  Chaque entrée est mixée en permanence dans MASTER (pas de micro => pas de larsen).
#  Options : description, rate, format, period-size, headroom, enabled,
#            gain-db (gain de l'entrée en dB, -40 à +24, défaut 0) : pour équilibrer
#            les sources entre elles. Un gain positif amplifie numériquement :
#            au-delà de ce que le signal permet, il sature (écrêtage).
# =============================================================================
[input.turntable]
description = Platine vinyle Sony (USB)
match.node.name = ~alsa_input\.usb-.*Sony.*
rate = 192000
# Platine plus faible que les sources numériques ? ex. gain-db = 6
#gain-db = 0

[input.spdif]
description = Entrée optique S/PDIF (son du PC)
# À ADAPTER : remplacer par le nom réel donné par « audio-hub list »
match.node.name = ~alsa_input\.usb-.*(SPDIF|S_PDIF|Optical|Digital).*
# Fréquence du signal S/PDIF ENTRANT. Elle doit être identique à celle que le PC
# envoie : l'adaptateur ne convertit pas et la Pi ne peut pas la détecter.
# Son « robotique » = fréquences différentes (voir README, Dépannage S/PDIF).
rate = 96000


# =============================================================================
#  MOPIDY (lecture de /media, réseau local uniquement)
# =============================================================================
[mopidy]
enabled = yes
http.port = 6680
mpd.port = 6600
# Dossiers parcourus (séparés par des virgules)
media-dirs = /media
# Interface web Iris (installée via pip) ; sinon client MPD ou API HTTP seule
iris = yes
# Réindexation de la bibliothèque locale (en plus d'un scan à chaque branchement)
scan-interval-minutes = 60
# Formats lus d'office : FLAC, MP3, OGG/Vorbis, Opus, WAV, AIFF.
# yes = ajoute AAC / M4A / ALAC / WMA… (ffmpeg, ≈ 300 Mo sur la carte SD).
# Après changement : sudo bash /opt/pi-sound-server/install.sh
extra-codecs = no
