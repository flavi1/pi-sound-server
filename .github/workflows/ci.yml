# Intégration continue : à chaque push et pull request.
# Pas de matériel audio ici : on valide la configuration et les fichiers générés.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck + Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Syntaxe bash + ShellCheck
        run: |
          for f in install.sh files/bin/audio-hub-diag tests/*.sh; do bash -n "$f"; done
          shellcheck -S warning install.sh files/bin/audio-hub-diag tests/*.sh
      - name: Python (compilation + pyflakes)
        run: |
          python3 -m py_compile files/bin/audio-hub
          pipx run pyflakes files/bin/audio-hub

  config:
    name: Configuration générée
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Outils PipeWire (spa-json-dump, si disponible)
        run: sudo apt-get update && sudo apt-get install -y pipewire-bin || true
      - run: bash tests/test-config.sh
      - name: "Knob (faux périphériques : HDMI-CEC + knob USB)"
        run: python3 tests/test-knob.py
      - name: "Liens des entrées vers MASTER (faux graphe)"
        run: python3 tests/test-links.py
      - name: "Bluetooth : agent de jumelage par code PIN (faux D-Bus)"
        run: python3 tests/test-bluetooth.py
